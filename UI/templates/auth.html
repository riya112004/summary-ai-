<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1f5">
  <title>Sign in | Workdesk</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f5;
      --panel: #fff;
      --ink: #14213d;
      --muted: #66738a;
      --line: #d9dfe8;
      --brand: #2b4fd8;
      --brand-dark: #203fb6;
      --soft: #e3e9fc;
      --danger: #b42318;
      --success: #18794e;
      font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 14%, rgba(43, 79, 216, .11), transparent 34%),
        radial-gradient(ellipse at 90% 88%, rgba(31, 122, 77, .08), transparent 30%),
        var(--bg);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid rgba(43, 79, 216, .32); outline-offset: 2px; }
    .layout {
      width: min(100%, 980px);
      min-height: 590px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border: 1px solid rgba(20, 33, 61, .08);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(20, 33, 61, .13);
    }
    .intro {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 42px;
      overflow: hidden;
      color: #fff;
      background: #14213d;
    }
    .intro::after {
      position: absolute;
      right: -110px;
      bottom: -135px;
      width: 330px;
      height: 330px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
      box-shadow: 0 0 0 32px rgba(255,255,255,.035), 0 0 0 68px rgba(255,255,255,.025);
      content: "";
    }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 17px; font-weight: 650; letter-spacing: .01em; }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 10px;
      color: #fff;
      background: rgba(255,255,255,.12);
      font-size: 17px;
    }
    .intro-copy { position: relative; z-index: 1; max-width: 370px; margin: 50px 0; }
    .eyebrow { color: #aebeff; font-size: 12px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .intro h1 { margin: 14px 0; font-size: clamp(32px, 4vw, 46px); line-height: 1.1; letter-spacing: -.04em; }
    .intro p { max-width: 350px; margin: 0; color: #c9d3e6; font-size: 15px; line-height: 1.7; }
    .intro-foot { position: relative; z-index: 1; color: #aab6ce; font-size: 12px; }

    .form-side { display: flex; align-items: center; justify-content: center; padding: 48px; }
    .form-wrap { width: min(100%, 370px); }
    .mobile-brand { display: none; }
    .form-wrap h2 { margin: 0; font-size: 27px; letter-spacing: -.025em; }
    .subtitle { margin: 7px 0 24px; color: var(--muted); font-size: 14px; }
    .switcher { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 24px; padding: 4px; border-radius: 9px; background: #f1f3f7; }
    .switcher button { min-height: 38px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; font-size: 13px; font-weight: 600; }
    .switcher button[aria-selected="true"] { color: var(--ink); background: #fff; box-shadow: 0 1px 4px rgba(20,33,61,.12); }
    .field { margin: 0 0 15px; }
    .field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
    .field input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input::placeholder { color: #9aa5b5; }
    .field input:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px rgba(43,79,216,.1); }
    .submit {
      width: 100%;
      min-height: 46px;
      margin-top: 7px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      background: var(--brand);
      font-weight: 650;
      transition: background .15s, transform .15s;
    }
    .submit:hover { background: var(--brand-dark); }
    .submit:active { transform: translateY(1px); }
    .submit:disabled { cursor: wait; opacity: .7; }
    .message { min-height: 21px; margin: 13px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }
    .signed-in { padding: 13px; border: 1px solid #b9e4ce; border-radius: 8px; color: var(--success); background: #effaf4; font-size: 14px; line-height: 1.6; }
    .hidden { display: none !important; }

    @media (max-width: 700px) {
      body { padding: 14px; }
      .layout { display: block; min-height: 0; border-radius: 14px; }
      .intro { display: none; }
      .form-side { padding: 34px 25px; }
      .mobile-brand { display: flex; margin-bottom: 32px; color: var(--ink); }
      .mobile-brand .brand-mark { border: 0; color: #fff; background: var(--brand); }
      .form-wrap h2 { font-size: 25px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="intro" aria-label="About Workdesk">
      <div class="brand"><span class="brand-mark" aria-hidden="true">W</span> Workdesk</div>
      <div class="intro-copy">
        <div class="eyebrow">Your day, in focus</div>
        <h1>Make room for what matters.</h1>
        <p>Keep your plans, documents, and daily priorities together in one calm workspace.</p>
      </div>
      <div class="intro-foot">A clearer view of your day.</div>
    </section>

    <section class="form-side">
      <div class="form-wrap">
        <div class="brand mobile-brand"><span class="brand-mark" aria-hidden="true">W</span> Workdesk</div>
        <h2 id="heading">Welcome back</h2>
        <p class="subtitle" id="subtitle">Sign in to continue to your workspace.</p>
        <div class="switcher" role="tablist" aria-label="Account access">
          <button id="loginTab" type="button" role="tab" aria-selected="true">Sign in</button>
          <button id="signupTab" type="button" role="tab" aria-selected="false">Create account</button>
        </div>

        <div id="signedIn" class="signed-in hidden" role="status"></div>
        <form id="authForm">
          <div class="field hidden" id="nameField">
            <label for="name">Full name</label>
            <input id="name" name="name" autocomplete="name" maxlength="80" placeholder="Your name">
          </div>
          <div class="field hidden" id="phoneField">
            <label for="phone">Phone number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" minlength="6" maxlength="20" placeholder="+91 98765 43210">
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" maxlength="128" required placeholder="At least 6 characters">
          </div>
          <div class="field hidden" id="confirmField">
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="Re-enter your password">
          </div>
          <button class="submit" id="submitButton" type="submit">Sign in</button>
          <p class="message" id="message" role="status" aria-live="polite"></p>
        </form>
        <button class="submit hidden" id="logoutButton" type="button">Sign out</button>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var mode = "login";
      var form = document.getElementById("authForm");
      var message = document.getElementById("message");
      var submitButton = document.getElementById("submitButton");
      var nameField = document.getElementById("nameField");
      var phoneField = document.getElementById("phoneField");
      var confirmField = document.getElementById("confirmField");
      var nameInput = document.getElementById("name");
      var phoneInput = document.getElementById("phone");
      var confirmInput = document.getElementById("confirmPassword");

      function setMessage(text, kind) {
        message.textContent = text;
        message.className = "message" + (kind ? " " + kind : "");
      }

      function setMode(nextMode) {
        mode = nextMode;
        var signingUp = mode === "signup";
        document.getElementById("heading").textContent = signingUp ? "Create your account" : "Welcome back";
        document.getElementById("subtitle").textContent = signingUp
          ? "Add your details to get started."
          : "Sign in to continue to your workspace.";
        document.getElementById("loginTab").setAttribute("aria-selected", String(!signingUp));
        document.getElementById("signupTab").setAttribute("aria-selected", String(signingUp));
        nameField.classList.toggle("hidden", !signingUp);
        phoneField.classList.toggle("hidden", !signingUp);
        confirmField.classList.toggle("hidden", !signingUp);
        nameInput.required = signingUp;
        phoneInput.required = signingUp;
        confirmInput.required = signingUp;
        document.getElementById("password").autocomplete = signingUp ? "new-password" : "current-password";
        submitButton.textContent = signingUp ? "Create account" : "Sign in";
        setMessage("", "");
      }

      async function readResponse(response) {
        var payload = await response.json().catch(function () { return {}; });
        if (!response.ok) {
          var detail = payload.detail;
          if (Array.isArray(detail)) detail = detail.map(function (item) { return item.msg; }).join(" ");
          throw new Error(detail || "Request failed. Please try again.");
        }
        return payload;
      }

      document.getElementById("loginTab").addEventListener("click", function () { setMode("login"); });
      document.getElementById("signupTab").addEventListener("click", function () { setMode("signup"); });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!form.reportValidity()) return;
        if (mode === "signup" && document.getElementById("password").value !== confirmInput.value) {
          setMessage("Passwords do not match.", "error");
          confirmInput.focus();
          return;
        }

        var payload = {
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        };
        if (mode === "signup") {
          payload.name = nameInput.value.trim();
          payload.phone = phoneInput.value.trim();
          payload.confirm_password = confirmInput.value;
        }

        submitButton.disabled = true;
        submitButton.textContent = mode === "signup" ? "Creating account..." : "Signing in...";
        setMessage("", "");
        try {
          await readResponse(await fetch(mode === "signup" ? "/api/signup" : "/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify(payload)
          }));
          window.location.assign("/dashboard");
        } catch (error) {
          setMessage(error.message, "error");
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = mode === "signup" ? "Create account" : "Sign in";
        }
      });

      async function checkSession() {
        try {
          await readResponse(await fetch("/api/me", { credentials: "same-origin" }));
          window.location.replace("/dashboard");
        } catch (error) {
          if (error.message !== "Not authenticated") setMessage(error.message, "error");
        }
      }

      document.getElementById("logoutButton").addEventListener("click", async function () {
        try {
          await readResponse(await fetch("/api/logout", {
            method: "POST",
            credentials: "same-origin"
          }));
          window.location.href = "/login";
        } catch (error) {
          setMessage(error.message, "error");
        }
      });

      checkSession();
    }());
  </script>
</body>
</html>
