<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily summary</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f5;--panel:#fff;--ink:#14213d;--mute:#5d6b82;--line:#d9dfe8;--brand:#2b4fd8;--brandsoft:#e3e9fc;--warn:#c2410c;--warnsoft:#fde9dc;--ok:#1f7a4d;--oksoft:#dff3e8;--side:#14213d;--sidetx:#c9d3e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1524;--panel:#16203a;--ink:#e8edf7;--mute:#98a6c0;--line:#27345a;--brand:#7c9bff;--brandsoft:#22305e;--warn:#ffa36b;--warnsoft:#44281a;--ok:#5fd199;--oksoft:#16392b;--side:#0a101d;--sidetx:#9fb0cf}}
:root[data-theme="dark"]{--bg:#0e1524;--panel:#16203a;--ink:#e8edf7;--mute:#98a6c0;--line:#27345a;--brand:#7c9bff;--brandsoft:#22305e;--warn:#ffa36b;--warnsoft:#44281a;--ok:#5fd199;--oksoft:#16392b;--side:#0a101d;--sidetx:#9fb0cf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sidetx);padding:24px 14px;position:sticky;top:0;height:100vh}
.logo{color:#fff;font-weight:600;font-size:17px;padding:0 10px 20px}
aside a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:6px;color:inherit;text-decoration:none;margin-bottom:2px}
aside a.on{background:rgba(255,255,255,.1);color:#fff}
aside a:hover{background:rgba(255,255,255,.06)}
aside .n{background:var(--warn);color:#fff;border-radius:10px;font-size:12px;padding:0 7px}
main{padding:28px 32px 48px;max-width:1280px;width:100%;min-width:0}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:28px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mute);margin:4px 0 0}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.header-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.upload-control{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.upload-btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:6px;padding:8px 14px;font-weight:500}
.upload-btn:hover{filter:brightness(.92)}
.upload-btn:disabled{opacity:.65;cursor:wait}
.upload-status{min-height:1em;color:var(--mute);font-size:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:116px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:13px;color:var(--mute)}
.stat.alert b{color:var(--warn)}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.plan-card{margin-bottom:16px}
.plan-title{font-weight:600}
.plan-focus{margin-top:8px;padding:10px 12px;background:var(--brandsoft);border-radius:6px}
.plan-focus small,.plan-milestones small{color:var(--mute)}
.plan-focus p,.plan-milestones p{margin:2px 0 0}
.plan-milestones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.plan-milestones[hidden]{display:none}
.plan-milestones:empty{display:none}
.plan-status{font-size:12px;color:var(--ok)}
h2{font-size:16px;margin:0;font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.hd small{color:var(--mute);font-size:13px}
/* timeline */
.tl{margin-bottom:16px}
.tl-scroll{overflow-x:auto}
.tl-track{position:relative;min-width:640px;height:92px;margin-top:6px}
.tl-hours{position:absolute;inset:0 0 auto 0;height:100%}
.tl-h{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:12px;color:var(--mute);padding-left:4px}
.tl-m{position:absolute;top:26px;height:52px;background:var(--brandsoft);border-left:3px solid var(--brand);border-radius:4px;padding:4px 8px;font-size:13px;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tl-m.l2{top:44px;height:44px}
.tl-m small{display:block;color:var(--mute)}
.tl-now{position:absolute;top:18px;bottom:0;width:2px;background:var(--warn)}
.tl-now::before{content:"Now";position:absolute;top:-18px;left:-14px;font-size:12px;background:var(--warn);color:#fff;border-radius:4px;padding:0 5px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
ul{list-style:none;margin:0;padding:0}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid var(--line);background:none;border-radius:6px;padding:2px 10px;font-size:13px;color:var(--mute)}
.tabs button[aria-pressed=true]{background:var(--brandsoft);color:var(--brand);border-color:transparent}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task input{margin-top:4px;width:16px;height:16px;accent-color:var(--brand)}
.task label{flex:1;cursor:pointer}
.task .t{display:block}
.task.done .t{text-decoration:line-through;color:var(--mute)}
.meta{font-size:13px;color:var(--mute)}
.tag{font-size:12px;border-radius:4px;padding:1px 7px;white-space:nowrap}
.tag.hi{background:var(--warnsoft);color:var(--warn)}
.tag.md{background:var(--brandsoft);color:var(--brand)}
.tag.ok{background:var(--oksoft);color:var(--ok)}
.mt{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mt.past{opacity:.55}
.mt .time{font-weight:600}
.mt .time span{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.mt .t{font-weight:500}
.join{border:1px solid var(--brand);color:var(--brand);background:none;border-radius:6px;padding:2px 10px;font-size:13px;align-self:center}
.join:hover{background:var(--brandsoft)}
.grp{font-size:13px;font-weight:600;margin:14px 0 2px;color:var(--mute)}
.grp:first-of-type{margin-top:0}
.doc{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.doc .t{font-weight:500}
.doc.renewed .t{color:var(--mute)}
.act{border:1px solid var(--line);background:none;border-radius:6px;padding:2px 10px;font-size:13px}
.act:hover{border-color:var(--brand);color:var(--brand)}
.empty{color:var(--mute);padding:14px 0;border-top:1px solid var(--line)}
.error{margin:0 0 12px;color:#b42318;font-size:13px}
@media (max-width:1060px){.grid{grid-template-columns:1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{display:none}main{padding:20px 14px 40px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo">Workdesk</div>
  <a class="on" href="#">Today</a>
  <a href="#">Tasks <span class="n" id="navTasks">0</span></a>
  <a href="#">Calendar</a>
  <a href="#">Documents <span class="n" id="navDocs">0</span></a>
  <a href="#">Team</a>
  <a href="#">Settings</a>
</aside>
<main>
  <header class="top">
    <div>
      <h1 id="greet">Good morning</h1>
      <p class="sub" id="date"></p>
    </div>
    <div class="header-actions">
      <div class="stats">
        <div class="stat"><b id="sTasks">0</b><span>tasks open</span></div>
        <div class="stat"><b id="sMeet">0</b><span>meetings left</span></div>
        <div class="stat alert"><b id="sDocs">0</b><span>documents expire today</span></div>
      </div>
      <div class="upload-control">
        <button class="upload-btn" id="uploadButton" type="button">Upload document</button>
        <input id="uploadFile" type="file" accept=".pdf,.docx,.txt,.csv,.png,.jpg,.jpeg,.bmp,.tif,.tiff" hidden>
        <small class="upload-status" id="uploadStatus" role="status" aria-live="polite"></small>
      </div>
    </div>
  </header>
  <p class="error" id="pageError" role="status" aria-live="polite"></p>

  <section class="card tl" aria-label="Today's schedule">
    <div class="hd"><h2>Your day</h2><small id="tlNote"></small></div>
    <div class="tl-scroll"><div class="tl-track" id="track"></div></div>
  </section>

  <section class="card plan-card" id="planCard" aria-labelledby="planHeading" hidden>
    <div class="hd"><h2 id="planHeading">Work plan</h2><div><small id="planPeriod"></small> <small class="plan-status" id="planStatus"></small></div></div>
    <div class="plan-title" id="planTitle"></div>
    <div class="plan-focus"><small>Today's focus</small><p id="planFocus"></p><p class="meta" id="planRoutine"></p></div>
    <div class="plan-milestones" id="planMilestones">
      <div><small id="planMonthLabel">Monthly focus</small><p id="planMonth"></p></div>
      <div><small id="planQuarterLabel">Quarterly focus</small><p id="planQuarter"></p></div>
    </div>
  </section>

  <div class="grid">
    <section class="card" aria-labelledby="hTasks">
      <div class="hd"><h2 id="hTasks">Tasks due today</h2>
        <div class="tabs"><button aria-pressed="true" data-f="all">All</button><button aria-pressed="false" data-f="open">Open</button></div>
      </div>
      <div class="bar" role="progressbar" aria-label="Tasks completed"><i id="prog"></i></div>
      <ul id="tasks"></ul>
    </section>

    <section class="card" aria-labelledby="hMeet">
      <div class="hd"><h2 id="hMeet">Meetings</h2><small id="meetCount"></small></div>
      <ul id="meets"></ul>
    </section>

    <section class="card" aria-labelledby="hDocs">
      <div class="hd"><h2 id="hDocs">Documents expiring</h2><small>Next 5 days</small></div>
      <div id="docs"></div>
    </section>
  </div>
</main>
</div>

<script>
var DATA = {
  user: "",
  tasks: [],
  meetings: [],
  docs: [],
  plan: null
};

var $ = function(id){return document.getElementById(id)};
var now = new Date(), nowH = now.getHours() + now.getMinutes()/60;
var filter = "all";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(h){var hh=Math.floor(h),mm=Math.round((h-hh)*60),ap=hh>=12?"PM":"AM";hh=hh%12||12;return hh+":"+(mm<10?"0":"")+mm+" "+ap}
function fmtTime(s){var p=s.split(":");return fmt(+p[0]+ +p[1]/60)}
function dayLabel(n){var d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}
function localDate(){return now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0")}
function dateLabel(value){var d=new Date(value+"T00:00:00");return Number.isNaN(d.getTime())?value:d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}
function minuteHour(value){return typeof value==="number"?value/60:null}
function taskTime(value){return /^\d{1,2}:\d{2}\s*(AM|PM)$/i.test(value)?value:/^\d{1,2}:\d{2}$/.test(value)?fmtTime(value):dateLabel(value)}

async function loadDashboard(){
  var response=await fetch("/api/dashboard-data",{credentials:"same-origin"});
  var result=await response.json().catch(function(){return {}});
  if(response.status===401){window.location.replace("/login");throw new Error("Please sign in again.")}
  if(!response.ok)throw new Error(result.detail||"Could not load dashboard data.");
  var today=localDate();
  DATA.user=result.user&&result.user.name||"there";
  DATA.plan=result.plan||null;
  DATA.tasks=(result.tasks||[]).filter(function(task){
    return task.status!=="Skipped"&&(task.task_date===today||task.due_date===today);
  }).map(function(task){
    return {
      id:task.id,
      title:task.title,
      project:task.category||String(task.task_type||"Task").replace(/_/g," "),
      due:task.start_time||task.due_date||today,
      pri:String(task.priority||"med").toLowerCase(),
      done:task.status==="Completed"
    };
  });
  DATA.meetings=(result.meetings||[]).filter(function(meeting){
    return meeting.start_minute!=null&&meeting.end_minute!=null;
  }).map(function(meeting){
    return {
      title:meeting.activity||"Meeting",
      start:minuteHour(meeting.start_minute),
      end:minuteHour(meeting.end_minute),
      where:meeting.location||"",
      link:false
    };
  });
  DATA.docs=(result.documents||[]).map(function(doc){
    var details=doc.details||{};
    return {
      id:doc.id,
      name:doc.title||doc.filename||"Untitled document",
      type:details.document_type&&details.document_type!=="Not available"?details.document_type:"Document",
      days:details.days_remaining
    };
  }).filter(function(doc){return typeof doc.days==="number"&&doc.days>=0&&doc.days<=5});
  header();timeline();planOverview();tasks();meetings();docs();
}

function planOverview(){
  var plan=DATA.plan;
  $("planCard").hidden=!plan;
  if(!plan)return;
  var schedule=plan.schedule||{},today=schedule.today||{};
  var month=schedule.month||schedule.next_month;
  var quarter=schedule.quarter||schedule.next_quarter;
  $("planTitle").textContent=plan.title||"Work plan";
  $("planPeriod").textContent=schedule.plan_start&&schedule.plan_end
    ?dateLabel(schedule.plan_start)+" – "+dateLabel(schedule.plan_end)
    :"";
  $("planStatus").textContent="";
  $("planFocus").textContent=today.focus||"No focus is listed for today.";
  $("planRoutine").textContent=today.routine||"";
  $("planStatus").textContent=schedule.in_plan_period===true?"Active today":
    schedule.in_plan_period===false?"Outside plan period":"";
  $("planMonthLabel").textContent=schedule.month?"Monthly focus":"Next monthly focus";
  $("planMonth").textContent=month
    ?(month.focus||("Month "+month.number+" ("+dateLabel(month.start)+" – "+dateLabel(month.end)+")"))
    :"No monthly focus available.";
  $("planQuarterLabel").textContent=schedule.quarter?"Quarterly focus":"Next quarterly focus";
  $("planQuarter").textContent=quarter
    ?(quarter.focus||("Q"+quarter.number+" "+(quarter.title||"")+" ("+dateLabel(quarter.start)+" – "+dateLabel(quarter.end)+")"))
    :"No quarterly focus available.";
  $("planMilestones").hidden=!month&&!quarter;
}

function header(){
  var g = nowH<12?"Good morning":nowH<17?"Good afternoon":"Good evening";
  $("greet").textContent = g + ", " + DATA.user;
  $("date").textContent = now.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}

function timeline(){
  var S=8,E=19,span=E-S,html="";
  for(var h=S;h<E;h++) html+='<div class="tl-h" style="left:'+((h-S)/span*100)+'%">'+fmt(h).replace(":00","")+'</div>';
  DATA.meetings.forEach(function(m,i){
    var l=(m.start-S)/span*100,w=(m.end-m.start)/span*100;
    html+='<div class="tl-m'+(i%2?' l2':'')+'" style="left:'+l+'%;width:'+w+'%" title="'+esc(m.title)+'">'+esc(m.title)+'<small>'+fmt(m.start)+'</small></div>';
  });
  if(nowH>=S&&nowH<=E) html+='<div class="tl-now" style="left:'+((nowH-S)/span*100)+'%"></div>';
  $("track").innerHTML='<div class="tl-hours">'+html+'</div>';
  var next=DATA.meetings.filter(function(m){return m.start>nowH})[0];
  $("tlNote").textContent = next ? "Next: "+next.title+" at "+fmt(next.start) : "No more meetings today";
}

function tasks(){
  var all=DATA.tasks, open=all.filter(function(t){return !t.done}).length, done=all.length-open;
  $("prog").style.width=(all.length?done/all.length*100:0)+"%";
  $("sTasks").textContent=open; $("navTasks").textContent=open;
  var list=all.filter(function(t){return filter==="all"||!t.done});
  $("tasks").innerHTML = list.length ? list.map(function(t){
    var due=taskTime(t.due);
    return '<li class="task'+(t.done?' done':'')+'"><input type="checkbox" id="t'+esc(t.id)+'" data-id="'+esc(t.id)+'"'+(t.done?' checked':'')+'>'+
      '<label for="t'+esc(t.id)+'"><span class="t">'+esc(t.title)+'</span><span class="meta">'+esc(t.project)+' &middot; due '+esc(due)+'</span></label>'+
      '<span class="tag '+(t.pri==="high"?"hi":t.pri==="low"?"ok":"md")+'">'+esc(t.pri.charAt(0).toUpperCase()+t.pri.slice(1))+'</span></li>';
  }).join("") : '<li class="empty">'+(all.length?"Nothing left. All tasks for today are done.":"No tasks scheduled for today.")+'</li>';
}

function meetings(){
  var left=DATA.meetings.filter(function(m){return m.end>nowH}).length;
  $("sMeet").textContent=left;
  $("meetCount").textContent=DATA.meetings.length+" today";
  $("meets").innerHTML = DATA.meetings.map(function(m){
    var past=m.end<=nowH, live=m.start<=nowH&&m.end>nowH;
    return '<li class="mt'+(past?' past':'')+'"><div class="time">'+fmt(m.start).replace(" ","&nbsp;")+'<span>'+Math.round((m.end-m.start)*60)+' min</span></div>'+
      '<div><div class="t">'+esc(m.title)+'</div><div class="meta">'+esc(m.where)+'</div></div>'+
      (live?'<span class="tag ok">In progress</span>':(m.link&&!past?'<button class="join">Join</button>':''))+'</li>';
  }).join("");
}

function docs(){
  var open=DATA.docs.filter(function(d){return !d.renewed});
  var today=open.filter(function(d){return d.days===0}), soon=open.filter(function(d){return d.days>0});
  $("sDocs").textContent=today.length; $("navDocs").textContent=open.length;
  function row(d){
    var tag = d.days===0 ? '<span class="tag hi">Today</span>' : '<span class="tag md">In '+d.days+' day'+(d.days>1?'s':'')+'</span>';
    return '<div class="doc"><div><div class="t">'+esc(d.name)+'</div><div class="meta">'+esc(d.type)+' &middot; '+dayLabel(d.days)+'</div></div>'+
      '<div style="display:flex;gap:8px;align-items:center">'+tag+
      '<button class="act" type="button" disabled title="Renewal is not available yet">Renew</button></div></div>';
  }
  var h='<div class="grp">Expires today ('+today.length+')</div>'+(today.length?today.map(row).join(""):'<div class="empty">Nothing expires today.</div>')+
        '<div class="grp">Within 5 days ('+soon.length+')</div>'+(soon.length?soon.map(row).join(""):'<div class="empty">Nothing else expiring soon.</div>');
  $("docs").innerHTML=h;
}

document.addEventListener("change",function(e){
  if(e.target.matches("#uploadFile")){
    var file=e.target.files[0];
    if(!file)return;
    e.target.value="";
    if(file.size>25*1024*1024){
      $("uploadStatus").textContent="File is too large. Maximum size is 25 MB.";
      return;
    }
    var button=$("uploadButton"),formData=new FormData();
    formData.append("file",file);
    button.disabled=true;
    $("uploadStatus").textContent="Uploading "+file.name+"…";
    fetch("/api/upload",{
      method:"POST",
      credentials:"same-origin",
      body:formData
    }).then(async function(response){
      var result=await response.json().catch(function(){return {}});
      if(response.status===401){window.location.replace("/login");throw new Error("Please sign in again.")}
      if(!response.ok)throw new Error(result.detail||"Could not upload the document.");
      $("uploadStatus").textContent="Uploaded "+(result.title||file.name)+".";
      $("pageError").textContent="";
      try{await loadDashboard()}catch(error){
        if(error.message!=="Please sign in again.")$("pageError").textContent=error.message;
      }
    }).catch(function(error){
      if(error.message!=="Please sign in again.")$("uploadStatus").textContent=error.message;
    }).finally(function(){button.disabled=false});
    return;
  }
  if(e.target.matches("#tasks input")){
    var input=e.target,t=DATA.tasks.filter(function(x){return x.id===input.dataset.id})[0];
    if(!t)return;
    input.disabled=true;
    fetch("/api/tasks/"+encodeURIComponent(t.id),{
      method:"PATCH",
      credentials:"same-origin",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({status:input.checked?"Completed":"Pending"})
    }).then(async function(response){
      var result=await response.json().catch(function(){return {}});
      if(response.status===401){window.location.replace("/login");throw new Error("Please sign in again.")}
      if(!response.ok)throw new Error(result.detail||"Could not update task.");
      $("pageError").textContent="";
      try{await loadDashboard()}catch(error){
        if(error.message!=="Please sign in again.")$("pageError").textContent=error.message;
      }
    }).catch(function(error){
      input.checked=!input.checked;
      $("pageError").textContent=error.message;
    }).finally(function(){input.disabled=false});
  }
});
document.addEventListener("click",function(e){
  if(e.target.closest("#uploadButton")){$("uploadFile").click();return}
  var f=e.target.closest(".tabs button");
  if(f){filter=f.dataset.f;document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-pressed",b===f)});tasks();return}
});

loadDashboard().catch(function(error){
  if(error.message!=="Please sign in again.")$("pageError").textContent=error.message;
});
</script>
</body>
</html>
